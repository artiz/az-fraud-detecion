AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  graph-fraud-sagemaker: long-lived, near-zero-cost infrastructure. S3 bucket for data
  and model artifacts, ECR repository for the DGL container, SageMaker execution role
  and a Model Registry group. The endpoint lives in endpoint.yaml so it can be deleted
  independently right after testing.

Parameters:
  ProjectName:
    Type: String
    Default: graph-fraud
    AllowedPattern: "^[a-z][a-z0-9-]{2,30}$"
    Description: Prefix for every resource name.
  ArtifactRetentionDays:
    Type: Number
    Default: 60
    MinValue: 1
    Description: Days after which model artifacts and processing outputs expire from S3.

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Suspended
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireModelArtifacts
            Status: Enabled
            Prefix: models/
            ExpirationInDays: !Ref ArtifactRetentionDays
          - Id: ExpireProcessingOutputs
            Status: Enabled
            Prefix: elliptic/processed/
            ExpirationInDays: !Ref ArtifactRetentionDays
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 2

  ContainerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: !Sub "${ProjectName}"
      ImageScanningConfiguration:
        ScanOnPush: true
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{"rulePriority": 1, "description": "keep last 5 images",
            "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 5},
            "action": {"type": "expire"}}]}

  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-sagemaker-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        # Processing/Training/Pipeline/Registry/Endpoint control plane. Scope down for production.
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Policies:
        - PolicyName: ProjectDataAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ProjectBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Sid: PullContainer
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: "*"
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sagemaker/*"
              - Sid: PassRoleToSageMaker
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-sagemaker-${AWS::Region}"
                Condition:
                  StringEquals:
                    iam:PassedToService: sagemaker.amazonaws.com

  ModelPackageGroup:
    Type: AWS::SageMaker::ModelPackageGroup
    Properties:
      ModelPackageGroupName: !Sub "${ProjectName}-models"
      ModelPackageGroupDescription: Illicit-transaction scorers (GraphSAGE / XGBoost) trained on Elliptic.

Outputs:
  BucketName:
    Value: !Ref ArtifactBucket
    Export:
      Name: !Sub "${AWS::StackName}-BucketName"
  SageMakerRoleArn:
    Value: !GetAtt SageMakerExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-SageMakerRoleArn"
  EcrRepositoryUri:
    Value: !GetAtt ContainerRepository.RepositoryUri
    Export:
      Name: !Sub "${AWS::StackName}-EcrRepositoryUri"
  ModelPackageGroupName:
    Value: !Sub "${ProjectName}-models"
