# Single source of truth for the experiment. Every key can be overridden from the
# command line of scripts/train.py (SageMaker passes hyperparameters the same way).
data:
  # Standard Elliptic protocol (Weber et al. 2019): time steps 1-34 train, 35-49 test.
  # We carve the last 5 train steps out as validation for early stopping and
  # threshold selection so that nothing is tuned on the test period.
  train_timesteps: [1, 29]
  val_timesteps: [30, 34]
  test_timesteps: [35, 49]
  feature_set: all          # all (165) | local (first 93)
  bidirectional_edges: true # message passing in both directions of a payment
seed: 42
xgboost:
  n_estimators: 600
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  early_stopping_rounds: 50
graphsage:
  hidden_dim: 128
  num_layers: 2
  dropout: 0.2
  aggregator: mean
  fanouts: [15, 10]
  batch_size: 1024
  epochs: 30
  lr: 0.003
  weight_decay: 0.0005
  illicit_class_weight: 0.7  # CE weight for class 1; licit gets 1 - this
  patience: 6
evaluation:
  # Model registration gate used by the SageMaker pipeline ConditionStep.
  min_pr_auc: 0.60
